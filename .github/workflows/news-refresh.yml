name: Refresh PHEME global news

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_news.py'
      - 'scripts/article_enrichment.py'
      - 'scripts/gal_feed.py'
      - 'scripts/gkg_enrichment.py'
      - 'scripts/test_news.py'
      - 'data/**'
      - '.github/workflows/news-refresh.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pheme-news-refresh
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - name: Checkout PHEME
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate news collector and country coverage
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check browser scripts
        run: |
          node --check app.js
          node --check news-engine.js
          node --check sw.js
      - name: Fetch live GDELT GAL RSS headlines (194-country topic catalog)
        run: python scripts/build_news.py
      - name: Validate feed structure
        run: |
          python - <<'PY'
          import json
          with open('news/stories.json',encoding='utf-8') as f:
              data=json.load(f)
          assert isinstance(data.get('events'),list)
          assert isinstance(data.get('diagnostics'),dict)
          assert data['diagnostics']['searchedCountries']>0
          assert all(x.get('reviewStatus')=='unverified-headline-aggregation' for x in data['events'])
          assert all(not x.get('facts') for x in data['events'])
          print('Validated',len(data['events']),'attributed event clusters')
          print('Source diagnostics:',data['diagnostics']['providers'])
          print('Article metadata:',data['diagnostics'].get('metadata'))
          print('GKG entity metadata:',data['diagnostics'].get('gkg'))
          print('Articles with source descriptions:',sum(bool(p.get('description')) for e in data['events'] for p in e.get('publications',[])))
          print('Events with attributed text:',sum(bool(e.get('reportedClaims')) for e in data['events']))
          PY
      - name: Commit updated newspaper edition
        run: |
          git config user.name "pheme-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/stories.json
          if git diff --cached --quiet; then
            echo "No new news data"
            exit 0
          fi
          git commit -m "news: refresh attributed global headlines"
          git push || (git pull --rebase origin main && git push)
      - name: Stage updated edition for GitHub Pages
        run: |
          mkdir -p dist/news
          cp index.html styles.css app.js news-engine.js sw.js icon.svg manifest.webmanifest dist/
          cp news/stories.json dist/news/stories.json
          touch dist/.nojekyll
          test -s dist/news/stories.json
      - name: Configure Pages for the refreshed edition
        uses: actions/configure-pages@v5
      - name: Upload refreshed newspaper
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publish the refreshed edition directly
        uses: actions/deploy-pages@v4
