name: Verify PHEME news source API

on:
  push:
    paths:
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    name: Check free GDELT source delivery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse live GAL RSS into PHEME country-matched publications
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import build_news
          from gal_feed import fetch_gal
          countries=build_news.read_json(build_news.COUNTRIES,[])
          articles,scanned=fetch_gal(countries,limit=120)
          print("Articles scanned from GDELT GAL feed:",scanned)
          print("Country-topic matched publications:",len(articles))
          print("Countries matched:",sorted({c for a in articles for c in a["countries"]})[:40])
          if articles:
              first=articles[0]
              print("Sample title:",first["title"])
              print("Source URL:",first["url"])
              print("Matched countries:",first["countries"])
          assert scanned>0, "GAL RSS feed has no items"
          assert articles, "No headlines mention countries in 15-minute window"
          assert all(a["api"]=="GDELT GAL RSS" and a["url"].startswith("http") for a in articles)
          PY
      - name: Probe GDELT raw GAL RSS and DOC JSON
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import urllib.request
          import urllib.error
          import build_news
          results={}
          sources={
            "GDELT GAL RSS":"https://data.gdeltproject.org/gdeltv3/gal/feed.rss",
            "GDELT GKG index":"https://data.gdeltproject.org/gkg/index.html"
          }
          for name,url in sources.items():
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'PHEME Source Audit/1.0'})
                  with urllib.request.urlopen(request,timeout=22) as response:
                      sample=response.read(4096)
                      results[name]=True
                      print(name,'OK',response.status,'type=',response.headers.get('content-type'),'sample=',sample[:160])
              except Exception as exc:
                  results[name]=False
                  print(name,'FAIL',type(exc).__name__,str(exc)[:250])
          try:
              items=build_news.gdelt_json('Canada')
              results['GDELT DOC JSON']=bool(items)
              print('GDELT DOC JSON','items=',len(items))
          except Exception as exc:
              results['GDELT DOC JSON']=False
              print('GDELT DOC JSON FAIL',type(exc).__name__,str(exc)[:250])
          print('Results:',results)
          if not any(results.values()):
              raise SystemExit('No GDELT delivery source accessible')
          PY
